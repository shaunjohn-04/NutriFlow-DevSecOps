apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nutriflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shaunjohn-04/NutriFlow-DevSecOps.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: nutriflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
